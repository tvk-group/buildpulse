name: TVK Labs security toolchain integrity
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/tvk_security_workflow_guard.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/tvk_security_workflow_guard.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tvk-toolchain-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolchain-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify audit workflow isolation
        run: python3 scripts/tvk_security_workflow_guard.py
