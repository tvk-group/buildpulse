name: TVK Labs isolated dependency security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/Cargo.lock"
      - "**/go.sum"
      - ".github/workflows/tvk-security-audit.yml"

permissions:
  contents: read

concurrency:
  group: tvk-security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "true"
      NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Audit production npm dependencies without installation
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          found=0
          while IFS= read -r -d '' lockfile; do
            found=1
            dir="$(dirname "$lockfile")"
            echo "::group::npm audit: $dir"
            if ! (cd "$dir" && npm audit --audit-level=high --omit=dev --ignore-scripts); then
              failures=1
            fi
            echo "::endgroup::"
          done < <(find . -type f -name package-lock.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::notice::No npm lockfile found; npm audit not applicable."
          fi
          if find . -type f -name Cargo.lock -not -path '*/.git/*' -print -quit | grep -q .; then
            echo "::notice::Rust detected; cargo-audit requires a separate least-privilege, reviewed job."
          fi
          if find . -type f -name go.sum -not -path '*/.git/*' -print -quit | grep -q .; then
            echo "::notice::Go detected; govulncheck requires a separate least-privilege, reviewed job."
          fi
          exit "$failures"
